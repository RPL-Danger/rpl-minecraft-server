services:
  mc:
    image: itzg/minecraft-server:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      EULA: "true"
      TYPE: "PAPER"
      VERSION: "26.2"
      ONLINE_MODE: "false"
      DIFFICULTY: "normal"
      MAX_PLAYERS: 50
      INIT_MEMORY: "2G"
      MAX_MEMORY: "8G"
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
        https://cdn.modrinth.com/data/OhduvhIc/versions/qztdh63o/veinminer-paper-2.12.1.jar
        https://cdn.modrinth.com/data/9eGKb6K1/versions/62MVmInV/voicechat-bukkit-2.6.21.jar
        https://cdn.modrinth.com/data/fALzjamp/versions/MdY6JATr/Chunky-Bukkit-1.5.3.jar
        https://cdn.modrinth.com/data/34T8oVNY/versions/2BipH1Kz/Pl3xMap-26.2-554.jar
        https://cdn.modrinth.com/data/pL3tkgTC/versions/xZasBC0p/Pl3xMarkers-0.8.3%2B26.2.jar
        https://cdn.modrinth.com/data/Cz6msz34/versions/nfyIDXIm/AxGraves-1.30.0.jar
        https://cdn.modrinth.com/data/lKEzGugV/versions/pIvQcXW8/PlaceholderAPI-2.12.3.jar
        https://cdn.modrinth.com/data/i66b9qzB/versions/QEgm1HMZ/vanish-1.2.1-all.jar
        https://cdn.modrinth.com/data/yeJMtJfW/versions/GuA4nQtq/grimac-bukkit-2.3.74-00dbb86.jar
        https://cdn.modrinth.com/data/TsLS8Py5/versions/wXS6bHiC/SkinsRestorer.jar
        https://cdn.modrinth.com/data/pZ2wrerK/versions/m45dAoAQ/emotecraft-paper-for-MC26.2-3.4.0-b.build.165.jar
        https://repo.essentialsx.net/snapshots/net/essentialsx/EssentialsX/2.22.1-SNAPSHOT/EssentialsX-2.22.1-20260829.175939-22.jar
        https://cdn.modrinth.com/data/bYazc7fd/versions/cAOIkpWF/InvSee%2B%2B.jar
        https://cdn.modrinth.com/data/vkW3dyrm/versions/Ytk0wkyr/Passky-3.3.0.jar
        https://github.com/GabiJunkes/MultipleBedSpawn/releases/download/V1.12.1/MultipleBedSpawn-1.12.1.jar
        https://cdn.modrinth.com/data/5QNgOj66/versions/sVWtLhTt/FancyHolograms-2.11.0%2B193.jar
        https://cdn.modrinth.com/data/8JFIQokh/versions/HUYpTuXh/creeper-recover-1.1.0-spigot.jar
        https://cdn.modrinth.com/data/xss83sOY/versions/6FX9dEc4/AdvancedServerList-Paper-5.9.0.jar
        https://cdn.modrinth.com/data/52W2RPUh/versions/Bc7hzkik/timber-1.8.4.jar

    ports:
      - "25565:25565"
      - "19132:19132/udp"
      - "24454:24454/udp"
      - "8080:8080"
    healthcheck:
      test: mc-health
      start_period: 2m
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - ./:/data/:z
